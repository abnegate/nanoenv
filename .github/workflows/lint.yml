name: Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  clang-format:
    name: Clang Format
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Latest Clang-Format
        run: |
          sudo apt-get update
          sudo apt-get install -y wget lsb-release
          DISTRO=$(lsb_release -sc)
          VERSION=$(wget -qO- "http://apt.llvm.org/${DISTRO}/dists/llvm-toolchain-${DISTRO}/main/binary-amd64/Packages" | grep -oP '(?<=Package: clang-format-)[0-9]+' | sort -nr | head -n1)
          echo "Detected Clang-Format version: ${VERSION}"
          echo "deb http://apt.llvm.org/${DISTRO}/ llvm-toolchain-${DISTRO}-${VERSION} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y "clang-format-${VERSION}"
          sudo ln -sf "/usr/bin/${VERSION}" "/usr/bin/clang-format"

      - name: Run Clang-Format
        run: |
          FILES=$(git ls-files '*.cpp' '*.h')
          clang-format -n --Werror --style=file ${FILES} 2>&1 | tee clang-format-report.txt
          if [ -s clang-format-report.txt ]; then
            echo "Clang-Format found issues."
            exit 1
          fi

  clang-tidy:
    name: Clang Tidy
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            cmake \
            ninja-build \
            ccache \
            build-essential \
            libdrogon-dev \
            libsimdjson-dev \
            libjsoncpp-dev \
            libsodium-dev

      - name: Cache CMake & ccache
        uses: actions/cache@v3
        with:
          path: |
            build
            ~/.ccache
          key: cmake-cache-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}
          restore-keys: |
            cmake-cache-${{ runner.os }}-

      - name: Configure CMake with Ninja
        run: |
          cmake -B build \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -G Ninja
          ln -sf build/compile_commands.json compile_commands.json

      - name: Run Clang-Tidy
        run: |
          FILES=$(git ls-files '*.cpp' '*.h')
          run-clang-tidy -p build ${FILES} | tee clang-tidy-report.txt
          if grep -q "warning:" clang-tidy-report.txt; then
            echo "Clang-Tidy found issues."
            exit 1
          fi


  upload-reports:
    name: Upload Clang Reports
    runs-on: ubuntu-22.04
    needs: [ clang-format, clang-tidy ]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Upload Clang Reports
        uses: actions/upload-artifact@v4
        with:
          name: clang-reports
          path: clang-*-report.txt